<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YPY social cover</title>
<style>
@font-face { font-family: CoverMontserrat; src: url("file://{{.Root}}/assets/fonts/montserrat-600-800-latin.woff2") format("woff2"); font-weight: 600 800; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f6f2e8; }
.cover {
  position: relative; width: 1200px; height: 630px; color: #2e2016;
  font-family: CoverMontserrat, sans-serif;
  background-color: #f6f2e8;
  background-image: radial-gradient(rgba(46, 32, 22, .14) .75px, transparent .75px);
  background-size: 18px 18px;
}
.frame { position: absolute; left: 64px; top: 48px; width: 1072px; height: 534px; border: 2px solid rgba(46, 32, 22, .14); background: #f6f2e8; }
.logo { position: absolute; left: 366px; top: 92px; width: 468px; height: 190px; }
.name { position: absolute; left: 0; top: 318px; width: 1200px; text-align: center; font: 800 76px/1.1 CoverMontserrat, sans-serif; letter-spacing: -3px; }
.description { position: absolute; left: 96px; top: 418px; width: 1008px; text-align: center; font: 600 26px/1.4 CoverMontserrat, sans-serif; color: rgba(46, 32, 22, .75); }
.domain { position: absolute; left: 0; top: 514px; width: 1200px; text-align: center; font: 700 20px/1 CoverMontserrat, sans-serif; letter-spacing: 3px; color: #af3310; }
.mark { position: absolute; width: 16px; height: 16px; transform: translate(-50%, -50%); }
.mark::before, .mark::after { content: ""; position: absolute; background: #af3310; }
.mark::before { left: 7px; top: 0; width: 2px; height: 16px; }
.mark::after { left: 0; top: 7px; width: 16px; height: 2px; }
.nw { left: 65px; top: 49px; } .ne { left: 1135px; top: 49px; }
.sw { left: 65px; top: 581px; } .se { left: 1135px; top: 581px; }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <img class="logo" src="file://{{.Root}}/assets/ypy.svg" width="468" height="190" alt="">
  <div class="name">{{.Name}}</div>
  <div class="description">{{.Description}}</div>
  <div class="domain">{{.Domain}}</div>
  <span class="mark nw"></span><span class="mark ne"></span><span class="mark sw"></span><span class="mark se"></span>
</div>
</body>
</html>
